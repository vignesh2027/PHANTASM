site_name: PHANTASM
site_description: "Probabilistic Hallucination-Aware Neural Transformation with Adaptive Synthesis Method"
site_author: Vignesh S
site_url: https://vignesh2027.github.io/PHANTASM
repo_url: https://github.com/vignesh2027/PHANTASM
repo_name: vignesh2027/PHANTASM

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - The Paradigm Shift: paradigm.md
  - Architecture: architecture.md
  - Getting Started: getting_started.md
  - Pillars:
    - Pillar I — HGT: pillars/hgt.md
    - Pillar II — CMN: pillars/cmn.md
    - Pillar III — UC: pillars/uc.md
  - Datasets: datasets.md
  - Training: training.md
  - Results: results.md
  - Case Studies:
    - Medical AI: case_studies/medical.md
    - Scientific Discovery: case_studies/discovery.md
    - Financial AI: case_studies/finance.md
    - Educational Tech: case_studies/edtech.md
  - API Reference: api.md
  - FAQ: faq.md
  - Research Paper: paper.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_bases: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vignesh2027
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/vigneshwar-s
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/phantasm-llm/
  analytics:
    provider: google
    property: G-XXXXXXXXXX
